apiVersion: apps/v1
kind: Deployment
metadata:
  name: hireai-worker
  namespace: hireai
spec:
  replicas: 1
  selector:
    matchLabels: {app: hireai-worker}
  template:
    metadata:
      labels: {app: hireai-worker}
    spec:
      terminationGracePeriodSeconds: 120   # let an in-flight resume finish
      containers:
        - name: worker
          image: hireai-backend:latest      # same image as the API
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef: {name: hireai-config}
            - secretRef: {name: hireai-secrets}
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {memory: 2Gi}
