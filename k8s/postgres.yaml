# Fine for a demo or a small cluster. For real data prefer a managed PostgreSQL that offers pgvector.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hireai
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, name: pg}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hireai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: hireai}
            - {name: POSTGRES_DB, value: hireai}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: hireai-secrets, key: POSTGRES_PASSWORD}}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "hireai", "-d", "hireai"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 10Gi}}
