apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hireai-api
  namespace: hireai
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hireai-api}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
# CPU is a rough proxy for worker load. Scaling on queue length is better (KEDA's Redis list scaler
# on the RQ queue), but that needs KEDA installed, so it is not assumed here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hireai-worker
  namespace: hireai
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hireai-worker}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 75}}
