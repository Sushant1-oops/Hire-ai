apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hireai-api
  namespace: hireai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.hireai.example.com          # change
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: hireai-api, port: {number: 80}}}}
